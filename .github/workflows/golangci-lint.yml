name: golangci-lint
on:
  push:
    branches:
    - master
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v3
        with:
          go-version: 1.17
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
